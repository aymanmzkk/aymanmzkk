<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338" role="img" aria-label="Dietech">
  <title>Dietech</title>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.09"/></pattern>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <style>
    .blob { animation: float ease-in-out infinite alternate; }
    @keyframes float { 0% { transform: translate(0, 0) } 50% { transform: translate(60px, -30px) } 100% { transform: translate(-50px, 25px) } }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1) } }

    .cspin { transform-box: view-box; transform-origin: 500px 70px; animation: spin linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

    .n { animation: up .8s ease-out .2s both; }
    .s { animation: up .8s ease-out .5s both; }
    .chip { animation: up .6s ease-out both; }
</style>
  <rect width="600" height="338" rx="16" fill="#0B1220"/>
  <g><circle class="blob" cx="140" cy="300" r="150" fill="#22C55E" opacity="0.45" filter="url(#blur)" style="animation-duration:12s;animation-delay:-4s"/><circle class="blob" cx="480" cy="40" r="140" fill="#14B8A6" opacity="0.4" filter="url(#blur)" style="animation-duration:15s;animation-delay:-2s"/></g>
  <rect width="600" height="338" rx="16" fill="url(#dots)"/>
  <g><g class="cspin" style="animation-duration:12s;animation-direction:normal"><circle cx="500" cy="70" r="40" fill="none" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="3 6"/><circle cx="540" cy="70" r="3" fill="#22C55E" filter="url(#glow)" transform="rotate(30 500 70)"/></g><g class="cspin" style="animation-duration:20s;animation-direction:reverse"><circle cx="500" cy="70" r="64" fill="none" stroke="#14B8A6" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="40 10"/><circle cx="564" cy="70" r="3.5" fill="#14B8A6" filter="url(#glow)" transform="rotate(200 500 70)"/></g></g>
  <g><path class="tw" d="M80.3 86.6 L81.2 88.8 L83.5 89.8 L81.2 90.8 L80.3 93.1 L79.3 90.8 L77.0 89.8 L79.3 88.8 Z" fill="#FFFFFF" style="animation-duration:4.3s;animation-delay:-2.0s"/><path class="tw" d="M414.5 54.3 L415.7 56.9 L418.3 58.1 L415.7 59.2 L414.5 61.8 L413.4 59.2 L410.8 58.1 L413.4 56.9 Z" fill="#FFFFFF" style="animation-duration:4.1s;animation-delay:-2.1s"/><path class="tw" d="M531.2 273.5 L532.3 275.9 L534.7 276.9 L532.3 277.9 L531.2 280.3 L530.2 277.9 L527.8 276.9 L530.2 275.9 Z" fill="#FFFFFF" style="animation-duration:2.0s;animation-delay:-3.0s"/><path class="tw" d="M105.7 28.3 L107.0 31.3 L110.1 32.6 L107.0 33.9 L105.7 37.0 L104.4 33.9 L101.4 32.6 L104.4 31.3 Z" fill="#FFFFFF" style="animation-duration:4.1s;animation-delay:-3.3s"/><path class="tw" d="M535.8 83.8 L536.6 85.7 L538.5 86.5 L536.6 87.3 L535.8 89.2 L535.0 87.3 L533.1 86.5 L535.0 85.7 Z" fill="#FFFFFF" style="animation-duration:2.3s;animation-delay:-3.9s"/><path class="tw" d="M98.2 72.1 L99.0 73.9 L100.8 74.7 L99.0 75.4 L98.2 77.2 L97.4 75.4 L95.7 74.7 L97.4 73.9 Z" fill="#FFFFFF" style="animation-duration:2.1s;animation-delay:-0.2s"/></g>
  <text class="n" x="300.0" y="158" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Dietech</text>
  <text class="s" x="300.0" y="194" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">Nutrición personalizada</text>
  <g class="chip" style="animation-delay:0.90s"><rect x="184" y="222" width="53" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#22C55E" stroke-opacity="0.6"/><text x="210" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">PHP</text></g><g class="chip" style="animation-delay:1.05s"><rect x="246" y="222" width="89" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#22C55E" stroke-opacity="0.6"/><text x="291" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Laravel</text></g><g class="chip" style="animation-delay:1.20s"><rect x="346" y="222" width="71" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#22C55E" stroke-opacity="0.6"/><text x="381" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">MySQL</text></g>
</svg>
