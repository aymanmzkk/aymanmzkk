<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Fin de la transmisión">
  <title>Fin de la transmisión</title>
  <defs>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p { animation: p 4s ease-in-out infinite; }
    @keyframes p { from { transform: translateX(-240px) } to { transform: translateX(1200px) } }
  </style>
  <rect width="1200" height="70" rx="6" fill="#03060C"/>
  <line x1="24" y1="22" x2="1176" y2="22" stroke="#00E5FF" stroke-opacity="0.25"/>
  <rect class="p" x="0" y="21" width="240" height="2" fill="url(#pulse)"/>
  <text x="600.0" y="50" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" fill="#00E5FF" fill-opacity="0.75" letter-spacing="3">// FIN DE LA TRANSMISIÓN · GRACIAS POR VISITAR //</text>
</svg>
