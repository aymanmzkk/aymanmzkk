L873.3 189.3 L875.9 190.4 L873.3 191.5 L872.2 194.1 L871.1 191.5 L868.5 190.4 L871.1 189.3 Z" fill="#FFFFFF" style="animation-duration:2.9s;animation-delay:-4.0s"/><path class="tw" d="M838.2 150.8 L839.1 152.9 L841.2 153.8 L839.1 154.7 L838.2 156.8 L837.3 154.7 L835.2 153.8 L837.3 152.9 Z" fill="#FFFFFF" style="animation-duration:3.6s;animation-delay:-1.1s"/><path class="tw" d="M902.3 250.8 L903.3 253.1 L905.6 254.1 L903.3 255.1 L902.3 257.4 L901.3 255.1 L899.0 254.1 L901.3 253.1 Z" fill="#FFFFFF" style="animation-duration:3.4s;animation-delay:-3.6s"/><path class="tw" d="M800.4 45.4 L801.3 47.6 L803.5 48.5 L801.3 49.4 L800.4 51.6 L799.5 49.4 L797.3 48.5 L799.5 47.6 Z" fill="#FFFFFF" style="animation-duration:3.9s;animation-delay:-2.5s"/></g>

  <g class="hi">
    <rect x="60" y="62" width="112" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="78" cy="76" r="4.5" fill="#22C55E"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="90" y="81" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Hola, soy</text>
  </g>
  <g clip-path="url(#nameClip)">
    <text x="60" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Ayman Mouzakki</text>
  </g>
  <g clip-path="url(#nameText)"><rect class="shine" x="0" y="80" width="180" height="100" fill="url(#sh)"/></g>
  <rect class="bar" x="62" y="176" width="140" height="5" rx="2.5" fill="url(#brand)"/>

  <g clip-path="url(#typeClip)">
    <text x="62" y="222" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace" font-size="22" fill="#22D3EE">Desarrollador web · Valencia</text>
  </g>
  <rect class="caret" x="64" y="203" width="3" height="24" fill="#22D3EE">
    <animate attributeName="x" from="64" to="403" dur="1.8s" begin="1.4s" fill="freeze" calcMode="discrete" values="64;76;88;100;112;125;137;149;161;173;185;197;209;221;234;246;258;270;282;294;306;318;330;342;355;367;379;391;403"/>
  </rect>

  <text class="stack" x="62" y="282" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8" letter-spacing="1">Python  ·  PHP  ·  JavaScript  ·  TypeScript  ·  MySQL</text>
</svg>
