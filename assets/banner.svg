<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ayman Mouzakki · Desarrollador web · Valencia">
  <title>Ayman Mouzakki · Desarrollador web · Valencia</title>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.09"/></pattern>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="coreG"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <clipPath id="nameClip"><rect x="60" y="80" height="110" width="0"><animate attributeName="width" from="0" to="720" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect></clipPath>
    <clipPath id="nameText"><text x="60" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1">Ayman Mouzakki</text></clipPath>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="typeClip"><rect x="62" y="196" height="36" width="0"><animate attributeName="width" from="0" to="339" dur="1.8s" begin="1.4s" fill="freeze" calcMode="discrete" values="0;12;24;36;48;61;73;85;97;109;121;133;145;157;170;182;194;206;218;230;242;254;266;278;291;303;315;327;339"/></rect></clipPath>
  </defs>
  <style>
    .blob { animation: float ease-in-out infinite alternate; }
    @keyframes float { 0% { transform: translate(0, 0) } 50% { transform: translate(60px, -30px) } 100% { transform: translate(-50px, 25px) } }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1) } }

    .bspin { transform-box: view-box; transform-origin: 950px 180px; animation: spin linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

    .hi { animation: up .8s ease-out .1s both; }
    .stack { animation: up .9s ease-out 3.2s both; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) 1.1s both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .core { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.15); opacity: 1 } }
    .shine { animation: shine 6s ease-in-out 2.5s infinite; }
    @keyframes shine { 0% { transform: translateX(-300px) } 35%,100% { transform: translateX(900px) } }
</style>

  <rect width="1200" height="360" rx="18" fill="#0B1220"/>
  <g><circle class="blob" cx="260" cy="60" r="200" fill="#14B8A6" opacity="0.35" filter="url(#blur)" style="animation-duration:14s;animation-delay:-0s"/><circle class="blob" cx="700" cy="320" r="220" fill="#8B5CF6" opacity="0.3" filter="url(#blur)" style="animation-duration:18s;animation-delay:-6s"/><circle class="blob" cx="1050" cy="80" r="180" fill="#3B82F6" opacity="0.4" filter="url(#blur)" style="animation-duration:16s;animation-delay:-3s"/></g>
  <rect width="1200" height="360" rx="18" fill="url(#dots)"/>

  <g><g class="bspin" style="animation-duration:14s;animation-direction:normal"><circle cx="950" cy="180" r="62" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 6"/><circle cx="1012" cy="180" r="4" fill="#22D3EE" filter="url(#glow)" transform="rotate(0 950 180)"/></g><g class="bspin" style="animation-duration:22s;animation-direction:reverse"><circle cx="950" cy="180" r="100" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="2 10"/><circle cx="1050" cy="180" r="3.5" fill="#3B82F6" filter="url(#glow)" transform="rotate(120 950 180)"/><circle cx="1050" cy="180" r="3" fill="#FFFFFF" filter="url(#glow)" transform="rotate(300 950 180)"/></g><g class="bspin" style="animation-duration:30s;animation-direction:normal"><circle cx="950" cy="180" r="140" fill="none" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="60 14"/><circle cx="1090" cy="180" r="5" fill="#8B5CF6" filter="url(#glow)" transform="rotate(210 950 180)"/></g></g>
  <circle class="core" cx="950" cy="180" r="34" fill="url(#coreG)" filter="url(#glow)"/>
