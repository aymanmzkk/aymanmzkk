<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338" role="img" aria-label="Satori">
  <title>Satori</title>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.09"/></pattern>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <style>
    .blob { animation: float ease-in-out infinite alternate; }
    @keyframes float { 0% { transform: translate(0, 0) } 50% { transform: translate(60px, -30px) } 100% { transform: translate(-50px, 25px) } }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1) } }

    .cspin { transform-box: view-box; transform-origin: 500px 70px; animation: spin linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

    .n { animation: up .8s ease-out .2s both; }
    .s { animation: up .8s ease-out .5s both; }
    .chip { animation: up .6s ease-out both; }
</style>
  <rect width="600" height="338" rx="16" fill="#0B1220"/>
  <g><circle class="blob" cx="140" cy="300" r="150" fill="#F59E0B" opacity="0.45" filter="url(#blur)" style="animation-duration:12s;animation-delay:-5s"/><circle class="blob" cx="480" cy="40" r="140" fill="#3B82F6" opacity="0.4" filter="url(#blur)" style="animation-duration:15s;animation-delay:-3s"/></g>
  <rect width="600" height="338" rx="16" fill="url(#dots)"/>
  <g><g class="cspin" style="animation-duration:12s;animation-direction:normal"><circle cx="500" cy="70" r="40" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="3 6"/><circle cx="540" cy="70" r="3" fill="#F59E0B" filter="url(#glow)" transform="rotate(30 500 70)"/></g><g class="cspin" style="animation-duration:20s;animation-direction:reverse"><circle cx="500" cy="70" r="64" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="40 10"/><circle cx="564" cy="70" r="3.5" fill="#3B82F6" filter="url(#glow)" transform="rotate(200 500 70)"/></g></g>
  <g><path class="tw" d="M336.6 202.5 L337.9 205.7 L341.1 207.0 L337.9 208.4 L336.6 211.6 L335.2 208.4 L332.0 207.0 L335.2 205.7 Z" fill="#FFFFFF" style="animation-duration:2.7s;animation-delay:-2.6s"/><path class="tw" d="M503.2 281.5 L504.1 283.6 L506.2 284.5 L504.1 285.4 L503.2 287.4 L502.3 285.4 L500.3 284.5 L502.3 283.6 Z" fill="#FFFFFF" style="animation-duration:3.6s;animation-delay:-2.5s"/><path class="tw" d="M301.8 296.7 L302.9 299.4 L305.6 300.5 L302.9 301.7 L301.8 304.4 L300.6 301.7 L297.9 300.5 L300.6 299.4 Z" fill="#FFFFFF" style="animation-duration:3.1s;animation-delay:-3.8s"/><path class="tw" d="M370.5 111.1 L371.5 113.4 L373.8 114.4 L371.5 115.3 L370.5 117.6 L369.5 115.3 L367.2 114.4 L369.5 113.4 Z" fill="#FFFFFF" style="animation-duration:3.2s;animation-delay:-0.2s"/><path class="tw" d="M355.9 232.5 L357.0 235.0 L359.5 236.0 L357.0 237.1 L355.9 239.6 L354.9 237.1 L352.4 236.0 L354.9 235.0 Z" fill="#FFFFFF" style="animation-duration:4.1s;animation-delay:-3.7s"/><path class="tw" d="M328.9 218.0 L329.8 219.9 L331.7 220.8 L329.8 221.6 L328.9 223.6 L328.1 221.6 L326.1 220.8 L328.1 219.9 Z" fill="#FFFFFF" style="animation-duration:2.1s;animation-delay:-3.9s"/></g>
  <text class="n" x="300.0" y="158" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Satori</text>
  <text class="s" x="300.0" y="194" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">Un buscador web desde cero</text>
  <g class="chip" style="animation-delay:0.90s"><rect x="188" y="222" width="80" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#F59E0B" stroke-opacity="0.6"/><text x="228" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Python</text></g><g class="chip" style="animation-delay:1.05s"><rect x="278" y="222" width="53" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#F59E0B" stroke-opacity="0.6"/><text x="304" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">PHP</text></g><g class="chip" style="animation-delay:1.20s"><rect x="341" y="222" width="71" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" stroke="#F59E0B" stroke-opacity="0.6"/><text x="376" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">MySQL</text></g>
</svg>
